[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "starccm-mcp"
version = "0.1.0"
description = "Unofficial MCP server for Simcenter STAR-CCM+: read .sim files and logs without a licence, search the local docs, run macros on an open session."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
authors = [{ name = "RHerAle" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "pydantic>=2"]

[project.urls]
Homepage = "https://github.com/RHerAle/starccm-mcp"
Issues = "https://github.com/RHerAle/starccm-mcp/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
starccm-mcp = "starccm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/starccm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
